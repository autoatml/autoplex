# This workflow will install Python dependencies, run tests and lint with Python 3.10 and 3.11
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Testing Linux MLIPs

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        dep-group: ["matgl", "mace", "nep", "nequip"]

    steps:
    - name: Fetch Most Recent Docker Image Tag
      run: |
        TAG=$(curl -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/orgs/autoatml/packages/container/autoplex%2Fautoplex-python-3.10/versions \
            | jq -r 'sort_by(.created_at) | reverse | .[0].metadata.container.tags[0]')
        echo "VERSION=$TAG" >> $GITHUB_ENV

    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Fetch the entire Git history
        
    - name: Run tests using Docker image for Python ${{ matrix.python-version }}
      run: |
        docker pull ghcr.io/autoatml/autoplex/autoplex-python-${{ matrix.python-version }}:${{ env.VERSION }}

        docker run --rm \
          -v ${{ github.workspace }}:/workspace \
          -w /workspace \
          ghcr.io/autoatml/autoplex/autoplex-python-${{ matrix.python-version }}:${{ env.VERSION }} \
          bash -c "
          git config --global --add safe.directory /workspace && \
          python -m pip install --upgrade pip && \
          python -m uv cache clean && \
          python -m uv pip install '.[strict-${{ matrix.dep-group }},tests,aims]' && \
          if [ '${{ matrix.dep-group }}' = 'matgl' ]; then \
            python -m uv pip install 'dgl==2.4.0' -f 'https://data.dgl.ai/wheels/torch-2.4/repo.html'; \
          fi && \
          if [ '${{ matrix.python-version }}' = '3.10' ] && [ '${{ matrix.dep-group }}' = 'matgl' ]; then \
            python -m uv pip install 'ase==3.25.0'; \
          fi && \
          OMP_NUM_THREADS=1 NEQUIP_NUM_TASKS=1 pytest @/workspace/tests/test_data/test-${{ matrix.dep-group }}.txt --cache-clear --cov=autoplex --cov-report term-missing --cov-append -vv --durations-path /workspace/tests/test_data/.pytest-split-durations --store-durations
        "

        
    - name: Upload test durations artifact
      if: matrix.python-version == '3.10'
      uses: actions/upload-artifact@v4
      with:
        name: test-durations-${{ matrix.python-version }}-${{ matrix.dep-group }}
        include-hidden-files: true
        path: ./tests/test_data/.pytest-split-durations

    - name: Upload coverage
      if: matrix.python-version == '3.10'
      uses: actions/upload-artifact@v4
      with:
        name: coverage-${{ matrix.python-version }}-${{ matrix.dep-group }}
        include-hidden-files: true
        path: ./.coverage