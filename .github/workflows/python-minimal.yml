# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Minimal Testing

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write
  pull-requests: write


jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - uses: pre-commit/action@v3.0.1

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -l {0} # enables conda/mamba env activation by reading bash profile
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
        split: [1, 2, 3, 4, 5]


    steps:
    - name: Check out repo
      uses: actions/checkout@v4

    - name: Set up micromamba
      uses: mamba-org/setup-micromamba@main

    - name: Create mamba environment
      run: |
        micromamba create -n autopl python=${{ matrix.python-version }} --yes

    - name: Install uv
      run: micromamba run -n autopl pip install uv

    - name: Install Autoplex and dependencies
      run: |
        micromamba activate autopl
        uv pip install --upgrade pip
        uv pip install --editable '.[strict-base,strict-mace]'

        
    - name: Install dependencies
      run: |
        sudo apt-get update && sudo apt-get install -y \
          build-essential \
          bash \
          bc \
          ffmpeg \
          unzip \
          wget \
          gfortran \
          liblapack-dev \
          libblas-dev \
          cmake \
          make \
          curl \
          git


        mkdir -p /opt
        curl -fsSL https://www.mtg.msm.cam.ac.uk/files/airss-0.9.3.tgz -o /opt/airss-0.9.3.tgz
        tar -xf /opt/airss-0.9.3.tgz -C /opt
        rm /opt/airss-0.9.3.tgz
        cd /opt/airss
        make spglib
        make internal
        make install_internal
        make neat


    - name: Add AIRSS (Buildcell) to PATH
      run: echo "/opt/airss/bin" >> $GITHUB_PATH
      
    - name: Test with pytest
      run: |
        micromamba activate autopl
        OMP_NUM_THREADS=1 pytest --cache-clear --splits 5 --group ${{ matrix.split }} -vv 

